name: Build Ray Images

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".github/workflows/release.yaml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ihoholko

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      ray-cpu: ${{ steps.filter.outputs.ray-cpu }}
      ray-gpu: ${{ steps.filter.outputs.ray-gpu }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed images
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ray-cpu:
              - 'images/ray-cpu/**'

            ray-gpu:
              - 'images/ray-gpu/**'

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ray-cpu
          - image: ray-gpu
    if: needs.changes.outputs.ray-cpu == 'true' || needs.changes.outputs.ray-gpu == 'true'

    steps:
      - name: Check whether image changed
        id: gate
        if: needs.changes.outputs[matrix.image] == 'true'
        run: echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Read version
        id: version
        if: steps.gate.outputs.build == 'true'
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          VERSION="$(cat "images/${IMAGE}/VERSION")"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid ${IMAGE} version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an already published version
        if: steps.gate.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAGS_ERROR="$RUNNER_TEMP/package-tags-error"
          if ! TAGS="$(gh api --paginate \
            "/users/${OWNER}/packages/container/${IMAGE}/versions" \
            --jq '.[].metadata.container.tags[]?' 2>"$TAGS_ERROR")"; then
            if grep -q 'HTTP 404' "$TAGS_ERROR"; then
              TAGS=""
            else
              cat "$TAGS_ERROR" >&2
              exit 1
            fi
          fi

          if grep -Fxq -- "$VERSION" <<< "$TAGS"; then
            echo "::error title=Version already published::${IMAGE} version ${VERSION} already exists in GHCR. Increase images/${IMAGE}/VERSION before publishing."
            exit 1
          fi

      - name: Build and push image
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}